--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden; background:var(--bg-deep);}
canvas#space{position:fixed; inset:0; display:block; cursor:grab;}
canvas#space.dragging{cursor:grabbing;}
.hud{position:fixed; top:16px; left:18px; pointer-events:none; font-family:var(--mono);}
.hud .eyebrow{font-size:10px; letter-spacing:.28em; color:var(--dim); text-transform:uppercase;}
.hud h1{font-size:17px; font-weight:700; letter-spacing:.22em; color:var(--text); text-transform:uppercase; margin-top:4px;}
.hud .sub{font-size:11px; color:var(--dim); margin-top:4px; letter-spacing:.04em;}
#treeWrap{position:fixed; top:84px; left:18px; bottom:96px; width:254px; z-index:5;
transition:transform .25s ease;}
#treeWrap.closed{transform:translateX(calc(-100% - 18px));}
nav#tree{position:absolute; inset:0; overflow-y:auto; background:rgba(9,15,34,.92);
border:1px solid var(--line); border-radius:4px; padding:6px 0;
font-family:var(--mono); font-size:11px;}
#treeTab{position:absolute; right:-27px; top:6px; width:26px; height:36px;
border:1px solid var(--line); border-left:none; border-radius:0 4px 4px 0;
background:rgba(10,17,38,.9); color:var(--text); font-family:var(--mono);
font-size:12px; cursor:pointer;}
#treeTab:hover{border-color:#31456F;}
.trow{display:flex; align-items:center; gap:6px; padding:3px 10px 3px 0; cursor:pointer;
color:var(--dim); white-space:nowrap;}
.trow:hover{color:var(--text); background:rgba(24,36,70,.6);}
.trow .chev{width:14px; text-align:center; flex:none; color:#5E7099; cursor:pointer;}
.trow .chev:hover{color:var(--text);}
.trow .dot{width:7px; height:7px; border-radius:50%; flex:none;}
.trow.tfolder{color:#C7D3EE; font-weight:600;}
.trow.active{color:#FFFFFF; background:rgba(31,45,86,.9);}
.trow.inset{color:var(--text); background:rgba(20,30,60,.55);}
.edgekey{position:fixed; left:18px; bottom:44px; font-family:var(--mono); font-size:10px;
color:var(--dim); display:flex; flex-direction:column; gap:4px; pointer-events:none;}
.edgekey span{display:flex; align-items:center; gap:8px;}
.edgekey i{width:26px; height:0; border-top:2px solid var(--dim); display:inline-block;}
.edgekey i.tt{border-top-width:2.5px; border-color:#5F79B8;}
.edgekey i.tf{border-top-width:1px; border-color:#3A4C74;}
.hint{position:fixed; left:18px; bottom:14px; font-family:var(--mono); font-size:10px;
letter-spacing:.06em; color:var(--dim); pointer-events:none;}
.controls{position:fixed; top:16px; right:16px; display:flex; gap:6px; font-family:var(--mono);}
.controls button{
width:34px; height:30px; border:1px solid var(--line); border-radius:3px;
background:rgba(10,17,38,.72); color:var(--text); font-size:13px; cursor:pointer;
}
.controls button:hover{border-color:#31456F;}
.controls button:focus-visible{outline:2px solid var(--text); outline-offset:2px;}
aside#panel{
position:fixed; top:56px; right:16px; width:296px; max-width:calc(100vw - 32px);
background:rgba(9,15,34,.94); border:1px solid var(--line); border-radius:4px;
padding:14px 16px 16px; font-family:var(--body); color:var(--text);
display:none; backdrop-filter:blur(4px);
}
aside#panel.open{display:block;}
aside#panel .path{font-family:var(--mono); font-size:12px; color:var(--text);
word-break:break-all; padding-right:22px;}
aside#panel .story{display:inline-flex; align-items:center; gap:6px; margin-top:8px;
font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);}
aside#panel .story .dot{width:7px; height:7px; border-radius:50%;}
aside#panel .desc{font-size:12.5px; line-height:1.5; color:#B9C6E4; margin-top:10px;}
aside#panel button.close{position:absolute; top:8px; right:8px; width:22px; height:22px;
border:none; background:none; color:var(--dim); font-size:14px; cursor:pointer; font-family:var(--mono);}
aside#panel button.close:hover{color:var(--text);}
@media (max-width:640px){
#treeWrap{width:min(74vw, 254px); top:76px; bottom:120px;}
.edgekey{display:none;}
.hint{display:none;}
aside#panel{top:auto; bottom:110px; left:12px; right:12px; width:auto;}
}
@media (prefers-reduced-motion:reduce){ .motionoff{display:none;} }
</style>

ctx.fill();
ctx.strokeStyle = P.stroke;
ctx.lineWidth = 1;
ctx.stroke();
ctx.beginPath();
ctx.moveTo(x0 + fw - fold, y0);
ctx.lineTo(x0 + fw - fold, y0 + fold);
ctx.lineTo(x0 + fw, y0 + fold);
ctx.closePath();
ctx.fillStyle = P.fileFold;
ctx.fill();
if (isArtifact){
var s = 0.42*u;
ctx.save();
ctx.translate(pr.x, y0 + fh*0.62);
ctx.rotate(Math.PI/4);
ctx.globalAlpha = alpha * 0.92;
ctx.fillStyle = '#FFFFFF';
ctx.fillRect(-s/2, -s/2, s, s);
ctx.strokeStyle = P.line;
ctx.strokeRect(-s/2, -s/2, s, s);
ctx.restore();
} else if (fw > 11){
ctx.globalAlpha = alpha * 0.5;
ctx.strokeStyle = P.lines;
ctx.lineWidth = 1;
for (var i = 0; i < 3; i++){
var ly = y0 + fh*0.40 + i*fh*0.17;
ctx.beginPath();
ctx.moveTo(x0 + fw*0.18, ly);
ctx.lineTo(x0 + fw*0.78, ly);
ctx.stroke();
}
}
}
function drawNode(n, pr){
var P = PAL[n.island];
var alpha = nodeAlpha(n) * fog(pr.d);
var base = (n.type === 'core') ? 17 : (n.type === 'folder') ? 13 : (n.hub ? 13 : 8);
var u = base * pr.s;
if (n.type === 'folder' || n.type === 'core'){
drawFolderIcon(pr, P, alpha, u, n.type === 'core');
} else {
drawFileIcon(pr, P, alpha, u, n.role === 'artifact');
}
if (n.type === 'core' || n.hub){
ctx.globalAlpha = 0.45 * alpha;
ctx.beginPath();
ctx.strokeStyle = P.line;
ctx.lineWidth = 1;
ctx.arc(pr.x, pr.y, 1.8*u, 0, TAU);
ctx.stroke();
}
if (n.id === selectedId){
ctx.globalAlpha = 0.55 + 0.30*Math.sin(timeMs/300);
ctx.beginPath();
ctx.strokeStyle = '#FFFFFF';
ctx.lineWidth = 1.4;
ctx.arc(pr.x, pr.y, 2.1*u, 0, TAU);
ctx.stroke();
}
}
function labelVisible(n){
if (n.hub || n.type === 'core') return true;
if (subtreeSet && subtreeSet[n.id]) return true;
if (selectedId && neighbourSet(selectedId)[n.id]) return true;
if (hoverId && neighbourSet(hoverId)[n.id]) return true;
if (activeIsland && n.island === activeIsland) return true;
return false;
}
function drawLabel(n, pr){
if (!labelVisible(n)) return;
var alpha = nodeAlpha(n) * fog(pr.d);
if (alpha < 0.2 || pr.s < 0.45) return;
var name = n.path.replace(/\/$/, '').split('/').pop() + (n.type !== 'file' ? '/' : '');
if (n.type === 'core') name = 'repo/';
ctx.globalAlpha = 0.92 * alpha;
var base = (n.type === 'core') ? 17 : (n.hub || n.type === 'folder') ? 13 : 8;
var lift = ((n.type === 'folder' || n.type === 'core') ? 1.25 : 1.05) * base * pr.s;
ctx.fillText(name, pr.x, pr.y - lift - 7);
}
var prefersReducedMotion = window.matchMedia &&
window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var projCache = {};
var rafId = null, needsFrame = true, lastDraw = 0;
function draw(){
drawBackground();
var i, e, n, j;
for (i=0; i<EDGES.length; i++){
e = EDGES[i];
if (!e.scr){
e.scr = [];
for (j=0; j<e.pts.length; j++) e.scr.push({ x:0, y:0, s:0, d:0 });
}
for (j=0; j<e.pts.length; j++) projectInto(e.pts[j], e.scr[j]);
}
var edgeOrder = EDGES.slice().sort(function(a, b){
return b.scr[b.scr.length >> 1].d - a.scr[a.scr.length >> 1].d;
});
for (i=0; i<edgeOrder.length; i++) strokeEdge(edgeOrder[i]);
for (i=0; i<NODES.length; i++){
n = NODES[i];
if (!n.scr) n.scr = { x:0, y:0, s:0, d:0 };
projCache[n.id] = projectInto(n.p, n.scr);
}
var order = NODES.slice().sort(function(a, b){
return projCache[b.id].d - projCache[a.id].d;
});
for (i=0; i<order.length; i++) drawNode(order[i], projCache[order[i].id]);
ctx.font = '10.5px ui-monospace, Consolas, monospace';
ctx.textAlign = 'center';
ctx.fillStyle = '#D9E2F6';
for (i=0; i<order.length; i++) drawLabel(order[i], projCache[order[i].id]);
ctx.globalAlpha = 1;
}
function tick(now){
rafId = null;
var animating = playing && !prefersReducedMotion;
var dt = lastDraw ? Math.min(now - lastDraw, 100) : 16;
if (animating && !dragState.down){ rotY += CONFIG.AUTO_SPEED * dt / 1000; }
timeMs = now;
draw();               /* every vsync frame while animating — even pacing, no judder */
lastDraw = now;
needsFrame = false;
if (animating || needsFrame){ scheduleFrame(); }
}
function scheduleFrame(){
if (rafId == null){ rafId = requestAnimationFrame(tick); }
}
function invalidate(){
needsFrame = true;
scheduleFrame();
}
scheduleFrame();
var dragState = { down:false, moved:false, x:0, y:0, id:null };
var pointers = {};
function hitTest(mx, my){
var best = null, bestDist = 1e9;
NODES.forEach(function(n){
var pr = projCache[n.id] || project(n.p);
var base = (n.type === 'core') ? 17 : (n.hub || n.type === 'folder') ? 13 : 8;
var r = Math.max(1.3 * base * pr.s + 8, 15);
var dx = mx - pr.x, dy = my - pr.y;
var d2 = dx*dx + dy*dy;
if (d2 < r*r && d2 < bestDist){ best = n; bestDist = d2; }
});
return best;
}
canvas.addEventListener('pointerdown', function(ev){
canvas.setPointerCapture(ev.pointerId);
pointers[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
dragState.down = true; dragState.moved = false;
dragState.x = ev.clientX; dragState.y = ev.clientY;
canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', function(ev){
if (pointers[ev.pointerId]){
pointers[ev.pointerId].x = ev.clientX;
pointers[ev.pointerId].y = ev.clientY;
}
var keys = Object.keys(pointers);
if (keys.length === 2){
var p1 = pointers[keys[0]], p2 = pointers[keys[1]];
var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
if (dragState.pinch){
userZoomed = true;
zoom = Math.max(CONFIG.ZOOM_MIN, Math.min(CONFIG.ZOOM_MAX, zoom * dist / dragState.pinch));
invalidate();
}
dragState.pinch = dist;
dragState.moved = true;
return;
}
dragState.pinch = null;
if (dragState.down){
var dx = ev.clientX - dragState.x, dy = ev.clientY - dragState.y;
if (Math.abs(dx) + Math.abs(dy) > 4) dragState.moved = true;
rotY += dx * 0.005;
rotX = Math.max(-1.2, Math.min(1.2, rotX + dy * 0.005));
dragState.x = ev.clientX; dragState.y = ev.clientY;
invalidate();
} else if (ev.pointerType === 'mouse'){
var h = hitTest(ev.clientX, ev.clientY);
var hid = h ? h.id : null;
if (hid !== hoverId){
hoverId = hid;
invalidate();
}
canvas.style.cursor = h ? 'pointer' : 'grab';
}
});
function endPointer(ev){
delete pointers[ev.pointerId];
if (Object.keys(pointers).length < 2) dragState.pinch = null;
if (Object.keys(pointers).length === 0){
canvas.classList.remove('dragging');
if (dragState.down && !dragState.moved){
var h = hitTest(ev.clientX, ev.clientY);
if (h){ select(h.id); } else { select(null); }
}
dragState.down = false;
}
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function(ev){
ev.preventDefault();
userZoomed = true;
zoom = Math.max(CONFIG.ZOOM_MIN, Math.min(CONFIG.ZOOM_MAX, zoom * (1 - ev.deltaY * 0.0012)));
invalidate();
}, { passive:false });
var panel = document.getElementById('panel');
function select(id){
selectedId = id;
invalidate();
if (!id){ panel.classList.remove('open'); return; }
var n = nodeById[id];
var isl = ISLANDS[n.island];
document.getElementById('pPath').textContent = n.path;
var st = document.getElementById('pStory');
st.innerHTML = '';
var dot = document.createElement('span');
dot.className = 'dot'; dot.style.background = isl.color;
st.appendChild(dot);
st.appendChild(document.createTextNode(isl.name + ' · ' + n.role));
document.getElementById('pDesc').textContent = n.desc;
panel.classList.add('open');
}
document.getElementById('panelClose').addEventListener('click', function(){ select(null); });
var treeWrap = document.getElementById('treeWrap');
var treeEl = document.getElementById('tree');
var treeTab = document.getElementById('treeTab');
var TREE_CHILDREN = {};
var TREE_PARENT = {};
EDGES.forEach(function(e){
if (e.kind !== 'tree') return;
if (!TREE_CHILDREN[e.from]) TREE_CHILDREN[e.from] = [];
TREE_CHILDREN[e.from].push(e.to);
TREE_PARENT[e.to] = e.from;
});
var expanded = { root: true };   /* IDE default: root open, subfolders closed */
var TREE_ROWS = [];
function descendantSet(id){
var set = {};
var stack = [id];
while (stack.length){
var cur = stack.pop();
if (set[cur]) continue;
set[cur] = true;
(TREE_CHILDREN[cur] || []).forEach(function(c){ stack.push(c); });
}
return set;
}
function isRowVisible(id){
var p = TREE_PARENT[id];
while (p !== undefined){
if (!expanded[p]) return false;
p = TREE_PARENT[p];
}
return true;
}
function refreshTree(){
TREE_ROWS.forEach(function(row){
var id = row.dataset.id;
row.style.display = isRowVisible(id) ? 'flex' : 'none';
row.classList.toggle('active', subtreeId !== null && id === subtreeId);
row.classList.toggle('inset',
!!(subtreeSet && subtreeSet[id] && id !== subtreeId));
if (row.chevEl && row.hasKids){
row.chevEl.textContent = expanded[id] ? '▾' : '▸';
}
});
}
function clearSubtree(){
subtreeId = null; subtreeSet = null;
refreshTree();
invalidate();
}
function expandBranch(id){
Object.keys(descendantSet(id)).forEach(function(k){
if (TREE_CHILDREN[k]) expanded[k] = true;
});
}
function setSubtree(id){
if (subtreeId === id){ clearSubtree(); return; }
subtreeId = id;
subtreeSet = descendantSet(id);
activeIsland = null;
select(null);
expandBranch(id);   /* highlighting a folder opens its branch, IDE-style */
refreshTree();
invalidate();
}
function buildTree(){
function addRow(id, depth){
var nd = nodeById[id];
var hasKids = !!TREE_CHILDREN[id];
var row = document.createElement('div');
row.className = 'trow ' + ((nd.type === 'file') ? 'tfile' : 'tfolder');
row.dataset.id = id;
row.style.paddingLeft = (6 + depth*14) + 'px';
var chev = document.createElement('span');
chev.className = 'chev';
chev.textContent = hasKids ? '▸' : ' ';
if (hasKids){
chev.addEventListener('click', function(ev){
ev.stopPropagation();
expanded[id] = !expanded[id];
refreshTree();
});
}
row.appendChild(chev);
row.chevEl = chev;
row.hasKids = hasKids;
var dot = document.createElement('span');
dot.className = 'dot';
dot.style.background = ISLANDS[nd.island].color;
row.appendChild(dot);
var name = nd.path.replace(/\/$/, '').split('/').pop() + (nd.type !== 'file' ? '/' : '');
if (nd.type === 'core') name = 'repo/';
row.appendChild(document.createTextNode(name));
row.addEventListener('click', function(){
if (nd.type === 'file'){ select(id); } else { setSubtree(id); }
});
treeEl.appendChild(row);
TREE_ROWS.push(row);
// code-point order, not localeCompare: the sidebar has to agree with the order the
// generator emitted, and localeCompare answers differently per locale
var kids = (TREE_CHILDREN[id] || []).slice().sort(function(a, b){
var na = nodeById[a], nb = nodeById[b];
var fa = (na.type === 'file') ? 1 : 0, fb = (nb.type === 'file') ? 1 : 0;
if (fa !== fb) return fa - fb;
return na.path < nb.path ? -1 : na.path > nb.path ? 1 : 0;
});
kids.forEach(function(c){ addRow(c, depth + 1); });
}
addRow('root', 0);
refreshTree();
}
buildTree();
function setTreeOpen(open){
treeWrap.classList.toggle('closed', !open);
treeTab.textContent = open ? '⟨' : '⟩';
}
treeTab.addEventListener('click', function(){
setTreeOpen(treeWrap.classList.contains('closed'));
});
setTreeOpen(window.innerWidth > 640);
function setIsland(key){
activeIsland = (activeIsland === key) ? null : key;
clearSubtree();
selectedId = null;
panel.classList.remove('open');
invalidate();
}
var btnPlay = document.getElementById('btnPlay');
function setPlaying(v){
playing = v;
btnPlay.textContent = playing ? '⏸' : '▶';
invalidate();
}
btnPlay.addEventListener('click', function(){ setPlaying(!playing); });
function resetView(){
rotY = CONFIG.START_ROT_Y; rotX = CONFIG.START_ROT_X;
userZoomed = false; zoom = fitZoom();
activeIsland = null;
clearSubtree();
select(null);
}
document.getElementById('btnReset').addEventListener('click', resetView);
window.addEventListener('keydown', function(ev){
if (ev.key === ' '){ ev.preventDefault(); setPlaying(!playing); }
else if (ev.key >= '1' && ev.key <= '9'){ setIsland('S' + ev.key); }
else if (ev.key === '0' || ev.key === 'Escape'){ resetView(); }
});
</script>
</body>
</html>
