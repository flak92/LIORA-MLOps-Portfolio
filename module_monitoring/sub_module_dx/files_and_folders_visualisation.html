.trow{display:flex; align-items:center; gap:6px; padding:3px 10px 3px 0; cursor:pointer;

.trow.inset{color:var(--text); background:rgba(20,30,60,.55);}

var c = hexToRgb(hex);
var r = Math.round(c[0] + (255-c[0])*t);
var g = Math.round(c[1] + (255-c[1])*t);
var b = Math.round(c[2] + (255-c[2])*t);
return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function shadeStr(hex, level){   // the island colour turned LEVEL_HUE_STEP degrees and moved LEVEL_LIGHT_STEP per nesting level
if (!level) return hex;
var c = hexToRgb(hex).map(function(v){ return v/255; });
var max = Math.max(c[0], c[1], c[2]), min = Math.min(c[0], c[1], c[2]);
var l = (max + min)/2, d = max - min, h = 0, s = 0;
if (d > 0){
s = d / (1 - Math.abs(2*l - 1));
h = (max === c[0]) ? (c[1] - c[2])/d : (max === c[1]) ? (c[2] - c[0])/d + 2 : (c[0] - c[1])/d + 4;
h = (h*60 + 360) % 360;
}
h = (h + CONFIG.LEVEL_HUE_STEP * level + 360) % 360;
l = Math.max(0, Math.min(1, l + CONFIG.LEVEL_LIGHT_STEP * level));
var q = (1 - Math.abs(2*l - 1)) * s, x = q * (1 - Math.abs((h/60) % 2 - 1)), m = l - q/2;
var sector = [[q,x,0],[x,q,0],[0,q,x],[0,x,q],[x,0,q],[q,0,x]][Math.floor(h/60) % 6];
return '#' + sector.map(function(v){ return ('0' + Math.round((v + m)*255).toString(16)).slice(-2); }).join('');
}
function paletteOf(n){   // one palette per (island, nesting level), built on first use
var level = Math.max(0, pathDepth(n) - HUB_DEPTH[n.island]);
var key = n.island + ':' + level;
if (!PAL[key]){
var col = shadeStr(ISLANDS[n.island].color, level);
PAL[key] = {
line:       col,
folderBody: tintStr(col, 0.28),
folderTab:  tintStr(col, 0.14),
topline:    tintStr(col, 0.75),
fileBody:   tintStr(col, 0.32),
fileFold:   tintStr(col, 0.78),
stroke:     tintStr(col, 0.72),
lines:      tintStr(col, 0.85)
};
}
return PAL[key];
}
var STAR_SCR = { x:0, y:0, s:0, d:0 };
function drawBackground(){
if (!bgGrad){ bgGrad = makeBgGrad(); }
ctx.globalAlpha = 1;
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#9FB6E8';
for (var i=0; i<STARS.length; i++){
var st = STARS[i];
projectInto(st, STAR_SCR);
if (STAR_SCR.d < 100) continue;
ctx.globalAlpha = 0.16 * st.m * fog(STAR_SCR.d) + 0.04;
ctx.fillRect(STAR_SCR.x, STAR_SCR.y, st.m > 0.8 ? 1.6 : 1, st.m > 0.8 ? 1.6 : 1);
}
}
function strokeEdge(e){
var alpha = edgeAlpha(e);
var pts = e.scr;
var midFog = fog(pts[pts.length >> 1].d);
ctx.beginPath();
ctx.moveTo(pts[0].x, pts[0].y);
for (var i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
if (e.thick){          /* folder – folder */
ctx.strokeStyle = '#5F79B8';
ctx.globalAlpha = 0.75 * alpha * midFog;
ctx.lineWidth = 2.2;
} else {               /* folder – file */
ctx.strokeStyle = '#3A4C74';
ctx.globalAlpha = 0.45 * alpha * midFog;
ctx.lineWidth = 1;
}
ctx.stroke();
}
function pathRoundRect(x, y, w, h, r){
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.lineTo(x + w - r, y);
ctx.quadraticCurveTo(x + w, y, x + w, y + r);
ctx.lineTo(x + w, y + h - r);
ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
ctx.lineTo(x + r, y + h);
ctx.quadraticCurveTo(x, y + h, x, y + h - r);
ctx.lineTo(x, y + r);
ctx.quadraticCurveTo(x, y, x + r, y);
ctx.closePath();
}
function drawFolderIcon(pr, P, alpha, u, isCore){
var bw = 2.3*u, bh = 1.5*u, tw = 1.0*u, th = 0.42*u;
var rad = Math.max(1.2, 0.16*u);
var x0 = pr.x - bw/2, y0 = pr.y - bh/2 + th*0.3;
ctx.globalAlpha = alpha;
pathRoundRect(x0, y0 - th, tw, th + rad*2, rad);
ctx.fillStyle = isCore ? '#DDE5F6' : P.folderTab;
ctx.fill();
pathRoundRect(x0, y0, bw, bh, rad);
ctx.fillStyle = isCore ? '#EEF2FB' : P.folderBody;
ctx.fill();
ctx.strokeStyle = isCore ? '#7E90B8' : P.stroke;
ctx.lineWidth = 1;
ctx.stroke();
ctx.globalAlpha = alpha * 0.6;
ctx.beginPath();
ctx.moveTo(x0 + rad, y0 + 1);
ctx.lineTo(x0 + bw - rad, y0 + 1);
ctx.strokeStyle = P.topline;
ctx.stroke();
}
function drawFileIcon(pr, P, alpha, u, isArtifact){
var fw = 1.55*u, fh = 2.0*u, fold = 0.55*u;
var x0 = pr.x - fw/2, y0 = pr.y - fh/2;
if (isArtifact){
ctx.globalAlpha = alpha * 0.30;   /* cheap halo instead of shadowBlur */
ctx.fillStyle = P.line;
ctx.beginPath();
ctx.arc(pr.x, pr.y, 1.7*u, 0, TAU);
ctx.fill();
}
ctx.globalAlpha = alpha;
ctx.beginPath();
ctx.moveTo(x0, y0);
ctx.lineTo(x0 + fw - fold, y0);
ctx.lineTo(x0 + fw, y0 + fold);
ctx.lineTo(x0 + fw, y0 + fh);
ctx.lineTo(x0, y0 + fh);
ctx.closePath();
ctx.fillStyle = P.fileBody;
ctx.fill();
ctx.strokeStyle = P.stroke;
ctx.lineWidth = 1;
ctx.stroke();
ctx.beginPath();
ctx.moveTo(x0 + fw - fold, y0);
ctx.lineTo(x0 + fw - fold, y0 + fold);
ctx.lineTo(x0 + fw, y0 + fold);
ctx.closePath();
ctx.fillStyle = P.fileFold;
ctx.fill();
if (isArtifact){
var s = 0.42*u;
ctx.save();
ctx.translate(pr.x, y0 + fh*0.62);
ctx.rotate(Math.PI/4);
ctx.globalAlpha = alpha * 0.92;
ctx.fillStyle = '#FFFFFF';
ctx.fillRect(-s/2, -s/2, s, s);
ctx.strokeStyle = P.line;
ctx.strokeRect(-s/2, -s/2, s, s);
ctx.restore();
} else if (fw > 11){
ctx.globalAlpha = alpha * 0.5;
ctx.strokeStyle = P.lines;
ctx.lineWidth = 1;
for (var i = 0; i < 3; i++){
var ly = y0 + fh*0.40 + i*fh*0.17;
ctx.beginPath();
ctx.moveTo(x0 + fw*0.18, ly);
ctx.lineTo(x0 + fw*0.78, ly);
ctx.stroke();
}
}
}
function drawNode(n, pr){
var P = paletteOf(n);
var alpha = nodeAlpha(n) * fog(pr.d);
var base = (n.type === 'core') ? 17 : (n.type === 'folder') ? 13 : (n.hub ? 13 : 8);
var u = base * pr.s;
if (n.type === 'folder' || n.type === 'core'){
drawFolderIcon(pr, P, alpha, u, n.type === 'core');
} else {
drawFileIcon(pr, P, alpha, u, n.role === 'artifact');
}
if (n.type === 'core' || n.hub){
ctx.globalAlpha = 0.45 * alpha;
ctx.beginPath();
ctx.strokeStyle = P.line;
ctx.lineWidth = 1;
ctx.arc(pr.x, pr.y, 1.8*u, 0, TAU);
ctx.stroke();
}
if (n.id === selectedId){
ctx.globalAlpha = 0.55 + 0.30*Math.sin(timeMs/300);
ctx.beginPath();
ctx.strokeStyle = '#FFFFFF';
ctx.lineWidth = 1.4;
ctx.arc(pr.x, pr.y, 2.1*u, 0, TAU);
ctx.stroke();
}
}
function labelVisible(n){
if (n.hub || n.type === 'core') return true;
if (subtreeSet && subtreeSet[n.id]) return true;
if (selectedId && neighbourSet(selectedId)[n.id]) return true;
if (hoverId && neighbourSet(hoverId)[n.id]) return true;
if (activeIsland && n.island === activeIsland) return true;
return false;
}
function drawLabel(n, pr){
if (!labelVisible(n)) return;
var alpha = nodeAlpha(n) * fog(pr.d);
if (alpha < 0.2 || pr.s < 0.45) return;
var name = labelOf(n);
ctx.globalAlpha = 0.92 * alpha;
var base = (n.type === 'core') ? 17 : (n.hub || n.type === 'folder') ? 13 : 8;
var lift = ((n.type === 'folder' || n.type === 'core') ? 1.25 : 1.05) * base * pr.s;
ctx.fillText(name, pr.x, pr.y - lift - 7);
}
var prefersReducedMotion = window.matchMedia &&
window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var projCache = {};
function draw(){
drawBackground();
var i, e, n, j;
for (i=0; i<EDGES.length; i++){
e = EDGES[i];
if (!e.scr){
e.scr = [];
for (j=0; j<e.pts.length; j++) e.scr.push({ x:0, y:0, s:0, d:0 });
}
for (j=0; j<e.pts.length; j++) projectInto(e.pts[j], e.scr[j]);
}
var edgeOrder = EDGES.slice().sort(function(a, b){
return b.scr[b.scr.length >> 1].d - a.scr[a.scr.length >> 1].d;
});
for (i=0; i<edgeOrder.length; i++) strokeEdge(edgeOrder[i]);
for (i=0; i<NODES.length; i++){
n = NODES[i];
if (!n.scr) n.scr = { x:0, y:0, s:0, d:0 };
projCache[n.id] = projectInto(n.p, n.scr);
}
var order = NODES.slice().sort(function(a, b){
return projCache[b.id].d - projCache[a.id].d;
});
for (i=0; i<order.length; i++) drawNode(order[i], projCache[order[i].id]);
ctx.font = '10.5px ui-monospace, Consolas, monospace';
ctx.textAlign = 'center';
ctx.fillStyle = '#D9E2F6';
for (i=0; i<order.length; i++) drawLabel(order[i], projCache[order[i].id]);
ctx.globalAlpha = 1;
}
function tick(now){
rafId = null;
var animating = playing && !prefersReducedMotion;
var dt = lastDraw ? Math.min(now - lastDraw, 100) : 16;
if (animating && !dragState.down){ rotY += CONFIG.AUTO_SPEED * dt / 1000; }
timeMs = now;
draw();               /* every vsync frame while animating — even pacing, no judder */
lastDraw = now;
needsFrame = false;
if (animating || needsFrame){ scheduleFrame(); }
}
function scheduleFrame(){
if (rafId == null){ rafId = requestAnimationFrame(tick); }
}
function invalidate(){
needsFrame = true;
scheduleFrame();
}
scheduleFrame();
var dragState = { down:false, moved:false, x:0, y:0, id:null };
var pointers = {};
function hitTest(mx, my){
var best = null, bestDist = 1e9;
NODES.forEach(function(n){
var pr = projCache[n.id] || project(n.p);
var base = (n.type === 'core') ? 17 : (n.hub || n.type === 'folder') ? 13 : 8;
var r = Math.max(1.3 * base * pr.s + 8, 15);
var dx = mx - pr.x, dy = my - pr.y;
var d2 = dx*dx + dy*dy;
if (d2 < r*r && d2 < bestDist){ best = n; bestDist = d2; }
});
return best;
}
canvas.addEventListener('pointerdown', function(ev){
canvas.setPointerCapture(ev.pointerId);
pointers[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
dragState.down = true; dragState.moved = false;
dragState.x = ev.clientX; dragState.y = ev.clientY;
canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', function(ev){
if (pointers[ev.pointerId]){
pointers[ev.pointerId].x = ev.clientX;
pointers[ev.pointerId].y = ev.clientY;
}
if (dragState.down){
var dx = ev.clientX - dragState.x, dy = ev.clientY - dragState.y;
if (Math.abs(dx) + Math.abs(dy) > 4) dragState.moved = true;
rotY += dx * 0.005;
rotX = Math.max(-1.2, Math.min(1.2, rotX + dy * 0.005));
dragState.x = ev.clientX; dragState.y = ev.clientY;
invalidate();
} else if (ev.pointerType === 'mouse'){
var h = hitTest(ev.clientX, ev.clientY);
var hid = h ? h.id : null;
if (hid !== hoverId){
hoverId = hid;
invalidate();
}
canvas.style.cursor = h ? 'pointer' : 'grab';
}
});
function endPointer(ev){
delete pointers[ev.pointerId];
if (Object.keys(pointers).length === 0){
canvas.classList.remove('dragging');
if (dragState.down && !dragState.moved){
var h = hitTest(ev.clientX, ev.clientY);
if (h){ select(h.id); } else { select(null); }
}
dragState.down = false;
}
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function(ev){
ev.preventDefault();
userZoomed = true;
zoom = Math.max(CONFIG.ZOOM_MIN, Math.min(CONFIG.ZOOM_MAX, zoom * (1 - ev.deltaY * 0.0012)));
invalidate();
}, { passive:false });
var panel = document.getElementById('panel');
function select(id){
selectedId = id;
invalidate();
if (!id){ panel.classList.remove('open'); return; }
var n = nodeById[id];
var isl = ISLANDS[n.island];
document.getElementById('pPath').textContent = n.path;
var st = document.getElementById('pStory');
st.innerHTML = '';
var dot = document.createElement('span');
dot.className = 'dot'; dot.style.background = isl.color;
st.appendChild(dot);
st.appendChild(document.createTextNode(isl.name + ' · ' + n.role));
document.getElementById('pDesc').textContent = n.desc;
panel.classList.add('open');
}
document.getElementById('panelClose').addEventListener('click', function(){ select(null); });
var treeWrap = document.getElementById('treeWrap');
var treeEl = document.getElementById('tree');
var treeTab = document.getElementById('treeTab');
var TREE_CHILDREN = {};
var TREE_PARENT = {};
EDGES.forEach(function(e){
if (e.type !== 'tree') return;
if (!TREE_CHILDREN[e.from]) TREE_CHILDREN[e.from] = [];
TREE_CHILDREN[e.from].push(e.to);
TREE_PARENT[e.to] = e.from;
});
var expanded = { root: true };   /* IDE default: root open, subfolders closed */
var TREE_ROWS = [];
function descendantSet(id){
var set = {};
var stack = [id];
while (stack.length){
var cur = stack.pop();
if (set[cur]) continue;
set[cur] = true;
(TREE_CHILDREN[cur] || []).forEach(function(c){ stack.push(c); });
}
return set;
}
function isRowVisible(id){
var p = TREE_PARENT[id];
while (p !== undefined){
if (!expanded[p]) return false;
p = TREE_PARENT[p];
}
return true;
}
function refreshTree(){
TREE_ROWS.forEach(function(row){
var id = row.dataset.id;
row.style.display = isRowVisible(id) ? 'flex' : 'none';
row.classList.toggle('active', subtreeId !== null && id === subtreeId);
row.classList.toggle('inset',
!!(subtreeSet && subtreeSet[id] && id !== subtreeId));
if (row.chevEl && row.hasKids){
row.chevEl.textContent = expanded[id] ? '▾' : '▸';
}
});
}
function clearSubtree(){
subtreeId = null; subtreeSet = null;
refreshTree();
invalidate();
}
function expandBranch(id){
Object.keys(descendantSet(id)).forEach(function(k){
if (TREE_CHILDREN[k]) expanded[k] = true;
});
}
function setSubtree(id){
if (subtreeId === id){ clearSubtree(); return; }
subtreeId = id;
subtreeSet = descendantSet(id);
activeIsland = null;
select(null);
expandBranch(id);   /* highlighting a folder opens its branch, IDE-style */
refreshTree();
invalidate();
}
function buildTree(){
function addRow(id, depth){
var nd = nodeById[id];
var hasKids = !!TREE_CHILDREN[id];
var row = document.createElement('div');
row.className = 'trow ' + ((nd.type === 'file') ? 'tfile' : 'tfolder');
row.dataset.id = id;
row.style.paddingLeft = (6 + depth*14) + 'px';
var chev = document.createElement('span');
chev.className = 'chev';
chev.textContent = hasKids ? '▸' : ' ';
if (hasKids){
chev.addEventListener('click', function(ev){
ev.stopPropagation();
expanded[id] = !expanded[id];
refreshTree();
});
}
row.appendChild(chev);
row.chevEl = chev;
row.hasKids = hasKids;
var dot = document.createElement('span');
dot.className = 'dot';
dot.style.background = paletteOf(nd).line;   // a row is a node, so its dot carries the node's shade
row.appendChild(dot);
row.dotEl = dot;
row.appendChild(document.createTextNode(labelOf(nd)));
row.addEventListener('click', function(){
if (nd.type === 'file'){ select(id); } else { setSubtree(id); }
});
treeEl.appendChild(row);
TREE_ROWS.push(row);
// code-point order, not localeCompare: the sidebar has to agree with the order the
// this page was written with, and localeCompare answers differently per locale
var kids = (TREE_CHILDREN[id] || []).slice().sort(function(a, b){
var na = nodeById[a], nb = nodeById[b];
var fa = (na.type === 'file') ? 1 : 0, fb = (nb.type === 'file') ? 1 : 0;
if (fa !== fb) return fa - fb;
return na.path < nb.path ? -1 : na.path > nb.path ? 1 : 0;
});
kids.forEach(function(c){ addRow(c, depth + 1); });
}
addRow('root', 0);
refreshTree();
}
buildTree();
function setTreeOpen(open){
treeWrap.classList.toggle('closed', !open);
treeTab.textContent = open ? '⟨' : '⟩';
}
treeTab.addEventListener('click', function(){
setTreeOpen(treeWrap.classList.contains('closed'));
});
setTreeOpen(true);
function renderLegend(){   // the active view by name, and its islands in layout order; a row isolates its island as the digit does
var legend = document.getElementById('legend');
legend.innerHTML = '';
var head = document.createElement('div');
head.className = 'legend__view';
head.textContent = activeView + ' view';
legend.appendChild(head);
ISLAND_ORDER.forEach(function(key){
var row = document.createElement('div');
row.className = 'legend__row';
var dot = document.createElement('span');
dot.className = 'dot'; dot.style.background = ISLANDS[key].color;
row.appendChild(dot);
row.appendChild(document.createTextNode(ISLANDS[key].name));
row.addEventListener('click', function(){ setIsland(key); });
legend.appendChild(row);
});
}
function setIsland(key){
activeIsland = (activeIsland === key) ? null : key;
clearSubtree();
selectedId = null;
panel.classList.remove('open');
invalidate();
}
var btnPlay = document.getElementById('btnPlay');
function setPlaying(v){
playing = v;
btnPlay.textContent = playing ? '⏸' : '▶';
invalidate();
}
btnPlay.addEventListener('click', function(){ setPlaying(!playing); });
function resetCamera(){
rotY = CONFIG.START_ROT_Y; rotX = CONFIG.START_ROT_X;
userZoomed = false; zoom = fitZoom();
activeIsland = null;
clearSubtree();
select(null);
}
document.getElementById('btnReset').addEventListener('click', resetCamera);
var btnView = document.getElementById('btnView');
btnView.style.display = VIEW_ORDER.length > 1 ? '' : 'none';   // one view, no view control
btnView.addEventListener('click', function(){ setView(nextView()); });
window.addEventListener('keydown', function(ev){
if (ev.key === ' '){ ev.preventDefault(); setPlaying(!playing); }
else if (STORY_DIGITS.indexOf(ev.key) >= 0){ setIsland('S' + ev.key); }
else if (ev.key === '0' || ev.key === 'Escape'){ resetCamera(); }
else if (ev.key === 'v' && VIEW_ORDER.length > 1){ setView(nextView()); }   // offered only when there is another view, like the digits
});
</script>
</body>
