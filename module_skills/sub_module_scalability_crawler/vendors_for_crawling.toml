# One table per vendor. Exactly one is `active`, and the crawl uses it; `argv` is the whole command line — the
# program, the model, the effort, the permissions and every other argument — run with shell=False at the root of the
# tree, the message on its stdin, the answer read from its stdout. The CLI is on PATH and logged in with its user's own
# account; no API key is ever written here.

[claude]
active = true
argv = ["claude", "-p", "--output-format", "text", "--max-turns", "1", "--strict-mcp-config",
        "--no-session-persistence", "--setting-sources", "project",
        "--model", "claude-opus-5", "--effort", "high", "--tools", ""]

[codex]
active = false
argv = ["codex", "exec", "--ignore-user-config", "--ephemeral", "--skip-git-repo-check", "--color", "never",
        "--model", "gpt-5.6-luna", "-c", "model_reasoning_effort=\"high\"", "--sandbox", "read-only",
        "--disable", "shell_tool", "--disable", "unified_exec", "--disable", "view_image",
        "--disable", "browser_use", "--disable", "computer_use"]
