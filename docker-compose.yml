# one image, three anchors: x-store-environment is the store contract — the four STORE_*_DIR every config.py reads,
# one variable per store, plus the thread cap that is correctness, not a setting; x-service is what every service of
# this file is; x-server adds the one command the dashboard and the assets share. environment: and volumes: REPLACE an
# anchor's key rather than extend it, so a service that adds a variable merges the store map with <<: (asset-btc), and
# a service that changes its mounts respells them (devops).
x-store-environment: &store_environment
  STORE_RAW_1M_DIR: /store/raw_1m
  STORE_ASSETS_ARTIFACTS_DIR: /store/assets_artifacts
  STORE_RUN_RECORDS_DIR: /store/run_records
  STORE_STATUS_DIR: /store/status
  OMP_NUM_THREADS: "1"

x-service: &service
  build: .
  image: mlops-portfolio-1m-pipeline
  init: true
  user: "${UID:-1000}:${GID:-1000}"
  environment: *store_environment
  volumes:
    - .:/app
    - ./store_raw_1m:/store/raw_1m
    - ./store_assets_artifacts:/store/assets_artifacts
    - ./store_run_records:/store/run_records
    - ./store_status:/store/status
  deploy:
    resources:
      limits:
        memory: 5g

x-server: &server
  <<: *service
  command: python -m module_monitoring.serve

services:
  pipeline:
    <<: *service

  dashboard:
    <<: *server
    ports:
      - "127.0.0.1:${PORT:-8900}:8900"

  asset-btc:
    <<: *server
    environment:
      <<: *store_environment
      ASSET: BTC

  # the one service that holds the docker socket, and the only one: its whole responsibility is
  # docker management and monitoring. It publishes no port — the dashboard proxies /devops/* to it.
  # volumes: replaces the anchor's key rather than extending it, so the code mount is repeated here.
  # it respells volumes: and keeps the code and the socket — it holds no store; its environment still carries the four
  # store names only because module_monitoring/config.py reads them at import
  devops:
    <<: *service
    command: python -m module_monitoring.sub_module_devops.serve
    group_add: ["${DOCKER_GID:-999}"]
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
