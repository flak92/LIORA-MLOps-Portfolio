# one image, two anchors: x-service is what every service of this file is, x-server adds the one
# command the dashboard and the assets share — the dashboard publishes it on the host, each asset
# container runs it in its asset role
x-service: &service
  build: .
  image: mlops-portfolio-1m-pipeline
  init: true
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - .:/app
  deploy:
    resources:
      limits:
        memory: 5g

x-server: &server
  <<: *service
  command: python -m module_monitoring.serve

services:
  pipeline:
    <<: *service

  dashboard:
    <<: *server
    ports:
      - "127.0.0.1:${PORT:-8900}:8900"

  asset-btc:
    <<: *server
    environment: {ASSET: BTC, OMP_NUM_THREADS: "1"}

  # the one service that holds the docker socket, and the only one: its whole responsibility is
  # docker management and monitoring. It publishes no port — the dashboard proxies /devops/* to it.
  # volumes: replaces the anchor's key rather than extending it, so the code mount is repeated here.
  portraefik:
    <<: *service
    command: python -m module_monitoring.sub_module_portraefik.serve
    group_add: ["${DOCKER_GID:-999}"]
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
