services:
  pipeline:
    build: .
    volumes:
      - ./raw_downloaded_1m_data:/app/raw_downloaded_1m_data
      - ./db:/app/db
      - ./assets:/app/assets
      - ./dashboard:/app/dashboard

  dashboard:
    build: .
    # 0.0.0.0 inside the container is required for the port mapping;
    # the host-side bind below keeps the dashboard loopback-only.
    command: python -m http.server 8900 --bind 0.0.0.0 --directory dashboard
    ports:
      - "127.0.0.1:8900:8900"
    volumes:
      - ./dashboard:/app/dashboard
