# one image, three anchors, six services — a service is a role, not an image. x-store-environment is the store contract:
# the four STORE_*_DIR every config.py reads, one variable per store, plus the thread cap that is correctness, not a
# setting. x-service is what every service of this file is; x-server adds the one command the dashboard and the assets
# share. The three runners — data, features, ml — carry no command: a stage is `docker compose run --rm <runner>
# python -m <module>.<stage> --tickers <T>`, one one-off container per asset, and exits; the three residents serve.
# environment: and volumes: REPLACE an anchor's key rather than extend it, so a service that adds a variable merges the
# store map with <<: (asset-btc) and a service respells its mounts whole. Every service mounts the code and the stores it
# touches, read-only where it only reads, and no store it does not touch. The project name is fixed:
# liora-dashboard-1, liora-asset-btc-1, liora-devops-1 on every host — two checkouts on one host share it, so run one at
# a time or override COMPOSE_PROJECT_NAME.
name: liora

x-store-environment: &store_environment
  STORE_RAW_1M_DIR: /store/raw_1m
  STORE_ASSETS_ARTIFACTS_DIR: /store/assets_artifacts
  STORE_RUN_RECORDS_DIR: /store/run_records
  STORE_STATUS_DIR: /store/status
  OMP_NUM_THREADS: "1"

x-service: &service
  build: .
  image: liora-1m-pipeline
  init: true
  user: "${UID:-1000}:${GID:-1000}"
  environment: *store_environment
  volumes:
    - .:/app

x-server: &server
  <<: *service
  command: python -m module_monitoring.serve

services:
  # the data layer writes the raw tree and the asset databases, and its own snapshot
  data:
    <<: *service
    volumes:
      - .:/app
      - ./store_raw_1m:/store/raw_1m
      - ./store_assets_artifacts:/store/assets_artifacts
      - ./store_status:/store/status
  # the feature layer never asks about a venue: it reads the canonical series and writes beside it
  features:
    <<: *service
    volumes:
      - .:/app
      - ./store_assets_artifacts:/store/assets_artifacts
      - ./store_status:/store/status
  # the one task that needs the ceiling: HPO and XGBoost above DuckDB's 4GB memory_limit
  ml:
    <<: *service
    volumes:
      - .:/app
      - ./store_assets_artifacts:/store/assets_artifacts
      - ./store_status:/store/status
    deploy:
      resources:
        limits:
          memory: 5g

  # the dashboard serves and never writes, so its stores are read-only; it seats the drawing, sub_module_dx/, below its
  # web root read-only — the DX jump of the page keeps its URL, and module_monitoring holds no code of the drawing. It
  # mounts no raw store: nothing it serves is measured there.
  dashboard:
    <<: *server
    ports:
      - "127.0.0.1:${PORT:-8900}:8900"
    volumes:
      - .:/app
      - ./store_assets_artifacts:/store/assets_artifacts:ro
      - ./store_run_records:/store/run_records:ro
      - ./store_status:/store/status:ro
      - ./sub_module_dx:/app/module_monitoring/sub_module_dx:ro

  # an asset container reports itself and writes nothing
  asset-btc:
    <<: *server
    environment:
      <<: *store_environment
      ASSET: BTC
    volumes:
      - .:/app
      - ./store_assets_artifacts:/store/assets_artifacts:ro
      - ./store_status:/store/status:ro

  # the one service that holds the docker socket, and the only one: its whole responsibility is docker management and
  # monitoring. It publishes no port — the dashboard proxies /devops/* to it. It holds no store; its environment still
  # carries the four store names only because module_monitoring/config.py reads them at import.
  devops:
    <<: *service
    command: python -m module_monitoring.sub_module_devops.serve
    group_add: ["${DOCKER_GID:-999}"]
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
